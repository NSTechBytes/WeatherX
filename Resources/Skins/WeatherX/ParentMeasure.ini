[Rainmeter]
Update=1000

[mWeatherParent]
Measure=Plugin
Plugin=WeatherX.dll
Latitude=29.696489
Longitude=72.549843
Units=metric
UpdateInterval=600
DataType=CurrentTemp

[mTemp]
Measure=Plugin
Plugin=WeatherX.dll
ParentName=mWeatherParent
DataType=CurrentTemp

[mHumidity]
Measure=Plugin
Plugin=WeatherX.dll
ParentName=mWeatherParent
DataType=CurrentHumidity

[mCondition]
Measure=Plugin
Plugin=WeatherX.dll
ParentName=mWeatherParent
DataType=CurrentCondition

[Background_Shape]
Meter=Shape
Shape=Rectangle 0,0,220,80,8| StrokeWidth 0 | FillColor 10,10,10,200

[mWeather]
Meter=STRING
MeasureName=mWeatherParent
MeasureName2=mHumidity
MeasureName3=mCondition
X=20
Y=20
FontColor=FFFFFF
Antialias=1
Text=Current Temperature:%1 #CRLF#Current Humidity : %2#CRLF#Current Condition : %3
